name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r editor/requirements.txt
          pip install pyinstaller
      - name: Build editor
        working-directory: editor
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedievalBattlefieldEditor Medieval_Battlefield_Editor_v4.py
      - name: Create version manifest
        shell: pwsh
        run: |
          $version = "$" + "{env:GITHUB_REF_NAME}".TrimStart('v')
          $manifest = @{ version=$version; name='Medieval Battlefield Editor' } | ConvertTo-Json
          $manifest | Set-Content 'editor/dist/version.json' -Encoding UTF8
      - name: Package editor
        shell: pwsh
        run: |
          Compress-Archive -Path 'editor/dist/*' -DestinationPath 'MedievalBattlefieldEditor-Windows-x64.zip' -Force
          (Get-FileHash 'MedievalBattlefieldEditor-Windows-x64.zip' -Algorithm SHA256).Hash | Set-Content 'MedievalBattlefieldEditor-Windows-x64.zip.sha256' -Encoding ASCII
      - name: Build launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedievalBattlefieldLauncher launcher/launcher.py
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            MedievalBattlefieldEditor-Windows-x64.zip
            MedievalBattlefieldEditor-Windows-x64.zip.sha256
            dist/MedievalBattlefieldLauncher.exe
