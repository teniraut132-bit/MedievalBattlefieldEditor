name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 5.9.10'
        required: true
        default: '5.9.10'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unpack uploaded editor source
        shell: pwsh
        run: |
          if (Test-Path 'Medieval_Battlefield_Editor_v5(2).zip') {
            Remove-Item 'source' -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path 'source' | Out-Null
            Expand-Archive -Path 'Medieval_Battlefield_Editor_v5(2).zip' -DestinationPath 'source' -Force
            Copy-Item 'source/mb_editor_v4/*' 'editor' -Recurse -Force
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r editor/requirements.txt
          pip install pyinstaller

      - name: Apply cartography, interaction, performance, boundary and 5.9.6 feature patches
        run: |
          python tools/patch_5_6_0_cartography.py
          python tools/optimize_5_9_0.py
          python tools/patch_5_9_3_landscape.py
          python tools/patch_5_9_4_interaction.py
          python tools/patch_5_9_5_map_boundary.py
          python tools/patch_5_9_6_library_battle.py
          python tools/patch_5_9_9_import.py
          python tools/restore_v5_8_0_roads_water.py

      - name: Validate source and patch scripts
        shell: pwsh
        run: |
          python -m py_compile editor/Medieval_Battlefield_Editor_v4.py launcher/launcher.py
          Get-ChildItem tools -Filter '*.py' | ForEach-Object { python -m py_compile $_.FullName }
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }

      - name: Verify Pillow Tk bridge before packaging
        run: python -c "from PIL import Image, ImageTk, _imagingtk; print('Pillow ImageTk bridge OK:', Image.__version__)"

      - name: Build editor with complete Pillow/Tk image modules
        working-directory: editor
        run: pyinstaller --noconfirm --clean --onedir --windowed --collect-all PIL --hidden-import=PIL.ImageTk --hidden-import=PIL._imagingtk --name MedievalBattlefieldEditor Medieval_Battlefield_Editor_v4.py

      - name: Verify packaged Pillow Tk bridge
        shell: pwsh
        run: |
          $bundle = 'editor/dist/MedievalBattlefieldEditor'
          $bridge = Get-ChildItem $bundle -Recurse -File -Filter '*imagingtk*.pyd' -ErrorAction SilentlyContinue
          if (-not $bridge) { throw 'Pillow _imagingtk binary is missing from the packaged editor.' }
          $imageTk = Get-ChildItem $bundle -Recurse -File -Filter 'ImageTk.py' -ErrorAction SilentlyContinue
          if (-not $imageTk) { throw 'Pillow ImageTk.py is missing from the packaged editor.' }
          $pilDir = Get-ChildItem $bundle -Recurse -Directory | Where-Object { $_.Name -eq 'PIL' } | Select-Object -First 1
          if (-not $pilDir) { throw 'PIL package directory is missing from the packaged editor.' }
          $env:PYTHONPATH = $pilDir.Parent.FullName + ';' + $env:PYTHONPATH
          python -c "from PIL import Image, ImageTk, _imagingtk; print('Packaged ImageTk bridge import OK:', Image.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Pillow ImageTk bridge failed to import.' }
          Write-Host "Pillow bridge packaged: $($bridge.FullName)"

      - name: Determine release version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } elseif ('${{ github.ref_type }}' -eq 'branch' -and '${{ github.ref_name }}'.StartsWith('release/')) {
            $version = '${{ github.ref_name }}'.Substring(8)
          } else {
            $version = '${{ inputs.version }}'
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $manifest = @{ version=$version; name='Medieval Battlefield Editor' } | ConvertTo-Json
          $manifest | Set-Content 'editor/dist/version.json' -Encoding utf8

      - name: Package editor
        shell: pwsh
        run: |
          Compress-Archive -Path 'editor/dist/*' -DestinationPath 'MedievalBattlefieldEditor-Windows-x64.zip' -Force
          (Get-FileHash 'MedievalBattlefieldEditor-Windows-x64.zip' -Algorithm SHA256).Hash | Set-Content 'MedievalBattlefieldEditor-Windows-x64.zip.sha256' -Encoding ascii

      - name: Build launcher (compatibility EXE)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedievalBattlefieldLauncher launcher/launcher.py

      - name: Build launcher (fast onedir package)
        run: pyinstaller --noconfirm --clean --onedir --windowed --name MedievalBattlefieldLauncher --distpath launcher_dist launcher/launcher.py

      - name: Package fast launcher
        shell: pwsh
        run: |
          Compress-Archive -Path 'launcher_dist/MedievalBattlefieldLauncher/*' -DestinationPath 'MedievalBattlefieldLauncher-Windows-x64.zip' -Force
          (Get-FileHash 'MedievalBattlefieldLauncher-Windows-x64.zip' -Algorithm SHA256).Hash | Set-Content 'MedievalBattlefieldLauncher-Windows-x64.zip.sha256' -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Medieval Battlefield Editor v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            MedievalBattlefieldEditor-Windows-x64.zip
            MedievalBattlefieldEditor-Windows-x64.zip.sha256
            dist/MedievalBattlefieldLauncher.exe
            MedievalBattlefieldLauncher-Windows-x64.zip
            MedievalBattlefieldLauncher-Windows-x64.zip.sha256
