name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 5.4.0'
        required: true
        default: '5.7.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unpack uploaded editor source
        shell: pwsh
        run: |
          if (Test-Path 'Medieval_Battlefield_Editor_v5(2).zip') {
            Remove-Item 'source' -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path 'source' | Out-Null
            Expand-Archive -Path 'Medieval_Battlefield_Editor_v5(2).zip' -DestinationPath 'source' -Force
            Copy-Item 'source/mb_editor_v4/*' 'editor' -Recurse -Force
          }

      - name: Bundle CC0 cartography sprites
        run: python tools/import_cc0_cartography.py

      - name: Apply 5.1.0 editor patch
        run: python tools/patch_5_1_0.py

      - name: Apply 5.1.1 road-network rendering patch
        run: python tools/patch_5_1_1.py

      - name: Apply 5.2.0 road-network patch
        run: python tools/patch_5_2_0.py

      - name: Repair editor syntax after patches
        run: python tools/repair_editor_syntax.py

      - name: Apply 5.4.0 graphics and terrain painting
        run: python tools/patch_5_4_0_graphics.py

      - name: Apply 5.6.0 smooth cartography and scrollable sprite library
        run: python tools/patch_5_6_0_cartography.py

      - name: Apply 5.7.0 object scaling and rendering optimization
        run: python tools/patch_5_7_0_scaling_optimization.py

      - name: Validate editor and launcher Python syntax
        run: |
          python -m py_compile editor/Medieval_Battlefield_Editor_v4.py
          python -m py_compile launcher/launcher.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r editor/requirements.txt
          pip install pyinstaller

      - name: Validate embedded sprite integrity
        run: python tools/validate_assets.py

      - name: Smoke-test real Tkinter startup, renderer, and sprite decoding
        run: python tools/smoke_test_editor.py

      - name: Build editor
        working-directory: editor
        run: pyinstaller --noconfirm --clean --onedir --windowed --name MedievalBattlefieldEditor Medieval_Battlefield_Editor_v4.py

      - name: Determine release version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } elseif ('${{ github.ref_type }}' -eq 'branch' -and '${{ github.ref_name }}'.StartsWith('release/')) {
            $version = '${{ github.ref_name }}'.Substring(8)
          } else {
            $version = '${{ inputs.version }}'
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $manifest = @{ version=$version; name='Medieval Battlefield Editor' } | ConvertTo-Json
          $manifest | Set-Content 'editor/dist/version.json' -Encoding utf8

      - name: Package editor
        shell: pwsh
        run: |
          if (Test-Path 'editor/ASSET_CREDITS.txt') { Copy-Item 'editor/ASSET_CREDITS.txt' 'editor/dist/ASSET_CREDITS.txt' -Force }
          Compress-Archive -Path 'editor/dist/*' -DestinationPath 'MedievalBattlefieldEditor-Windows-x64.zip' -Force
          (Get-FileHash 'MedievalBattlefieldEditor-Windows-x64.zip' -Algorithm SHA256).Hash | Set-Content 'MedievalBattlefieldEditor-Windows-x64.zip.sha256' -Encoding ascii

      - name: Build launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MedievalBattlefieldLauncher launcher/launcher.py

      - name: Create launcher release metadata
        shell: pwsh
        run: |
          $notes = "Релиз $env:RELEASE_VERSION`n`nПлавные соединения дорог и рек; масштабирование объектов 10–500%; оптимизация отрисовки при приближении; текстуры биомов и импорт пользовательских спрайтов."
          $sha = (Get-FileHash 'MedievalBattlefieldEditor-Windows-x64.zip' -Algorithm SHA256).Hash
          $meta = @{ version=$env:RELEASE_VERSION; name='Medieval Battlefield Editor'; notes=$notes; asset_url="https://github.com/${{ github.repository }}/releases/latest/download/MedievalBattlefieldEditor-Windows-x64.zip"; sha256=$sha } | ConvertTo-Json
          $meta | Set-Content 'latest.json' -Encoding utf8

      - name: Package complete Windows bundle
        shell: pwsh
        run: |
          $bundle = 'complete-bundle'
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$bundle/editor" | Out-Null
          Copy-Item 'editor/dist/*' "$bundle/editor" -Recurse -Force
          Copy-Item 'dist/MedievalBattlefieldLauncher.exe' "$bundle/MedievalBattlefieldLauncher.exe" -Force
          Copy-Item 'launcher/launcher_config.json' "$bundle/launcher_config.json" -Force
          @"
          MEDIEVAL BATTLEFIELD EDITOR
          ===========================

          1. Extract the complete bundle to a normal writable folder (do not run from inside the ZIP).
          2. Start MedievalBattlefieldLauncher.exe.
          3. The editor is already included in the editor folder; no separate editor download is needed.
          4. Keep launcher_config.json and the editor folder beside the launcher. launcher.log records update and launch diagnostics.
          5. If GitHub update checks are temporarily unavailable, the launcher still starts the installed editor.

          If Windows SmartScreen appears, verify that this archive came from the official project release before continuing.
          "@ | Set-Content "$bundle/README-FIRST.txt" -Encoding utf8
          Compress-Archive -Path "$bundle/*" -DestinationPath 'MedievalBattlefield-Complete-Windows-x64.zip' -Force
          (Get-FileHash 'MedievalBattlefield-Complete-Windows-x64.zip' -Algorithm SHA256).Hash | Set-Content 'MedievalBattlefield-Complete-Windows-x64.zip.sha256' -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Medieval Battlefield Editor v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            MedievalBattlefieldEditor-Windows-x64.zip
            MedievalBattlefieldEditor-Windows-x64.zip.sha256
            MedievalBattlefield-Complete-Windows-x64.zip
            MedievalBattlefield-Complete-Windows-x64.zip.sha256
            latest.json
            dist/MedievalBattlefieldLauncher.exe
